<title>Shift Malam: Serangan Bebek</title>
<style>
:root {
  --bg: #050505;
  --ui-green: #4ade80;
  --ui-red: #ef4444;
  --ui-yellow: #facc15;
  --font-mono: 'Courier New', Courier, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body {
  width: 100%; height: 100dvh; overflow: hidden; background: var(--bg); color: white;
  font-family: var(--font-mono); touch-action: none; -webkit-touch-callout: none;
}
#game-stage {
  position: relative; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #1a1a1a 0%, #000000 90%);
  perspective: 1000px; overflow: hidden;
}
/* OFFICE VIEW */
.office-wall {
  position: absolute; top: 0; bottom: 0; width: 20%; background: #111;
  border-right: 2px solid #222; z-index: 1;
}
.office-wall.right { right: 0; left: auto; border-left: 2px solid #222; border-right: none; }
.door-frame {
  position: absolute; top: 10%; bottom: 0; width: 15%; background: #0a0a0a;
  border: 4px solid #333; box-shadow: inset 0 0 20px #000;
}
.door-frame.left { left: 20%; }
.door-frame.right { right: 20%; }
.door-panel {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(45deg, #222, #222 10px, #1a1a1a 10px, #1a1a1a 20px);
  transform: translateY(-100%); transition: transform 0.3s cubic-bezier(0.5, 0, 0.5, 1);
  box-shadow: 0 10px 20px rgba(0,0,0,0.8);
}
.door-panel.closed { transform: translateY(0); }
.darkness-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: black; opacity: 0.95; transition: opacity 0.1s; pointer-events: none;
}
.light-active { opacity: 0 !important; }
/* CONTROLS */
.control-panel {
  position: absolute; top: 40%; width: 60px; height: 120px;
  background: #222; border: 2px solid #444; display: flex; flex-direction: column;
  justify-content: space-around; align-items: center; padding: 5px; z-index: 10;
}
.control-panel.left { left: calc(20% + 15% + 10px); }
.control-panel.right { right: calc(20% + 15% + 10px); }
.btn-control {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid #555;
  background: #333; color: #fff; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 10px;
  box-shadow: 0 4px 0 #111; active: translate-y(2px);
}
.btn-control.active { background: var(--ui-green); color: #000; box-shadow: 0 0 10px var(--ui-green); }
.btn-light.active { background: #fff; box-shadow: 0 0 15px #fff; }
/* DESK & FAN */
.desk {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 25%; background: #1a1a1a; border-top: 4px solid #333;
  z-index: 5; display: flex; justify-content: center; align-items: flex-end;
}
.fan {
  width: 80px; height: 80px; border: 4px solid #444; border-radius: 50%;
  position: relative; margin-bottom: 20px; animation: spin 0.5s linear infinite;
}
.fan-blade {
  position: absolute; top: 50%; left: 50%; width: 70%; height: 10px;
  background: #333; transform-origin: left;
}
.fan-blade:nth-child(1) { transform: rotate(0deg); }
.fan-blade:nth-child(2) { transform: rotate(120deg); }
.fan-blade:nth-child(3) { transform: rotate(240deg); }
@keyframes spin { 100% { transform: rotate(360deg); } }
/* HUD */
.hud-top {
  position: absolute; top: 20px; left: 20px; z-index: 20;
  text-shadow: 0 0 5px var(--ui-green);
}
.hud-time { font-size: 2rem; font-weight: bold; }
.hud-night { font-size: 1rem; color: #aaa; }
.hud-power {
  position: absolute; bottom: 20px; left: 20px; z-index: 20;
  font-size: 1.2rem; color: var(--ui-green);
}
.usage-bar {
  display: inline-block; width: 10px; height: 20px; background: #333; margin-right: 2px;
  border: 1px solid #555;
}
.usage-bar.active { background: var(--ui-green); box-shadow: 0 0 5px var(--ui-green); }
/* CAMERA SYSTEM */
.cam-toggle {
  position: absolute; bottom: 20px; right: 20px; width: 300px; height: 40px;
  background: rgba(255,255,255,0.1); border: 1px solid #555; z-index: 30;
  display: flex; align-items: center; padding-left: 10px; cursor: pointer;
  transition: background 0.2s;
}
.cam-toggle:hover { background: rgba(255,255,255,0.2); }
.cam-map {
  position: absolute; bottom: 80px; right: 20px; width: 250px; height: 200px;
  background: rgba(0,0,0,0.9); border: 2px solid #555; z-index: 25;
  display: none; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 10px;
}
.cam-map.active { display: grid; }
.cam-btn {
  background: #222; border: 1px solid #444; color: #888; font-size: 0.7rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.cam-btn.active { background: var(--ui-green); color: #000; }
.camera-feed {
  position: absolute; inset: 0; background: #000; z-index: 15; display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
.camera-feed.active { display: flex; }
.static-noise {
  position: absolute; inset: 0; opacity: 0.1;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  animation: noiseAnim 0.2s infinite;
}
@keyframes noiseAnim { 0% { transform: translate(0,0); } 100% { transform: translate(-5px,-5px); } }
/* THE DUCK */
.duck-entity {
  position: absolute; width: 200px; height: 250px; z-index: 4;
  transition: opacity 0.2s; opacity: 0;
}
.duck-body {
  width: 100%; height: 100%; background: #facc15;
  clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%);
  position: relative; box-shadow: inset -10px -10px 30px rgba(0,0,0,0.5);
}
.duck-eye {
  position: absolute; top: 20%; width: 30px; height: 30px; background: white; border-radius: 50%;
  border: 2px solid #000;
}
.duck-eye.left { left: 25%; } .duck-eye.right { right: 25%; }
.duck-pupil {
  position: absolute; top: 30%; left: 30%; width: 10px; height: 10px; background: black; border-radius: 50%;
}
.duck-beak {
  position: absolute; top: 40%; left: 50%; transform: translateX(-50%);
  width: 60px; height: 40px; background: #ea580c;
  clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%);
}
/* JUMPSCARE */
.jumpscare-overlay {
  position: fixed; inset: 0; background: black; z-index: 100; display: none;
  align-items: center; justify-content: center;
}
.jumpscare-duck {
  width: 80vw; height: 80vh; animation: shake 0.1s infinite;
}
@keyframes shake { 0% { transform: translate(2px, 2px) rotate(0deg); } 25% { transform: translate(-2px, -2px) rotate(-2deg); } 50% { transform: translate(2px, -2px) rotate(2deg); } 75% { transform: translate(-2px, 2px) rotate(0deg); } 100% { transform: translate(2px, 2px) rotate(0deg); } }
/* MENUS */
.menu-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.hidden { display: none !important; }
h1 { font-size: 3rem; color: var(--ui-green); text-shadow: 0 0 10px var(--ui-green); margin-bottom: 2rem; text-align: center; }
.btn-menu {
  background: transparent; border: 2px solid var(--ui-green); color: var(--ui-green);
  padding: 15px 40px; font-size: 1.5rem; font-family: var(--font-mono); cursor: pointer;
  margin: 10px; transition: all 0.2s;
}
.btn-menu:hover { background: var(--ui-green); color: black; box-shadow: 0 0 20px var(--ui-green); }
.rotate-warning {
  position: fixed; inset: 0; background: #000; z-index: 200; display: none;
  flex-direction: column; align-items: center; justify-content: center; color: white;
}
@media (orientation: portrait) { .rotate-warning { display: flex; } }
</style>
</head>
<body>

<div class="rotate-warning">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
  <h2 style="margin-top: 20px;">PUTAR PERANGKAT</h2>

<div id="game-stage">
  <!-- OFFICE -->
  <div class="office-wall left"></div>
  <div class="office-wall right"></div>
  
  <div class="door-frame left">
    <div class="door-panel" id="door-left"></div>
    <div class="darkness-overlay" id="light-left-overlay"></div>
    <div class="duck-entity" id="duck-left">
      <div class="duck-body"><div class="duck-eye left"><div class="duck-pupil"></div></div><div class="duck-eye right"><div class="duck-pupil"></div></div><div class="duck-beak"></div></div>
    </div>
  </div>
  
  <div class="door-frame right">
    <div class="door-panel" id="door-right"></div>
    <div class="darkness-overlay" id="light-right-overlay"></div>
    <div class="duck-entity" id="duck-right">

  <div class="camera-feed" id="camera-feed">

      <!-- Duck will appear here if in room -->

</div>

<!-- JUMPSCARE -->
<div class="jumpscare-overlay" id="jumpscare">
  <div class="duck-entity jumpscare-duck" style="opacity: 1;">
    <div class="duck-body" style="background: #ef4444;"><div class="duck-eye left"><div class="duck-pupil"></div></div><div class="duck-eye right"><div class="duck-pupil"></div></div><div class="duck-beak"></div></div>
  </div>
</div>

<!-- MENUS -->
<div class="menu-overlay" id="main-menu">
  <h1>SHIFT MALAM<br><span style="font-size: 0.5em; color: #facc15;">SERANGAN BEBEK</span></h1>
  <button class="btn-menu" id="start-btn">SHIFT BARU</button>
  <button class="btn-menu" id="settings-btn">PENGATURAN</button>
</div>

<div class="menu-overlay hidden" id="game-over-menu">
  <h1 style="color: var(--ui-red); text-shadow: 0 0 10px var(--ui-red);">GAME OVER</h1>
  <p style="color: #aaa; margin-bottom: 20px;">Kamu telah digagalkan oleh bebek.</p>
  <button class="btn-menu" id="retry-btn">COBA LAGI</button>
  <button class="btn-menu" id="menu-btn">MENU UTAMA</button>
</div>

<div class="menu-overlay hidden" id="win-menu">

  <p style="color: #aaa; margin-bottom: 20px;">Selamat! Shift selesai.</p>
  <button class="btn-menu" id="next-night-btn">SHIFT BERIKUTNYA</button>
</div>

<script>
// ==========================================
// GAME ENGINE & LOGIC
// ==========================================
const GAME = {
  state: 'menu', // menu, playing, gameover, win
  time: 0, // 0 to 6
  power: 100,
  usage: 1,
  doors: { left: false, right: false },
  lights: { left: false, right: false },
  camera: { active: false, current: '1A' },
  night: 1,
  lastTime: 0,
  powerTimer: 0,
  aiTimer: 0,
  
  // AI Locations: 1A (Stage), 1B (Dining), 1C (Cove), 2A (Hall West), 2B (Hall Corner), 3 (Kitchen), 4A (East Hall), 4B (East Corner), 5 (Restroom), OFFICE_L, OFFICE_R
  ducks: [
    { name: 'Chica', location: '1A', path: ['1A', '1B', '4A', '4B', 'OFFICE_R'], difficulty: 0, moveChance: 0 },
    { name: 'Bonnie', location: '1A', path: ['1A', '1B', '2A', '2B', 'OFFICE_L'], difficulty: 0, moveChance: 0 },
    { name: 'Foxy', location: '1C', path: ['1C', '2A', '2B', 'OFFICE_L'], difficulty: 0, moveChance: 0 }
  ],
  
  settings: { audio: true, haptic: true }
};

const CAMERAS = {
  '1A': 'Show Stage', '1B': 'Dining Area', '1C': 'Pirate Cove',
  '2A': 'West Hall', '2B': 'W. Hall Corner', '3': 'Kitchen',
  '4A': 'East Hall', '4B': 'E. Hall Corner', '5': 'Restrooms'
};

// Audio Context
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!GAME.settings.audio || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  
  if (type === 'blip') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'error') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'step') {
    osc.type = 'square'; osc.frequency.setValueAtTime(50, now);
    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'jumpscare') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
    osc.frequency.linearRampToValueAtTime(1000, now + 0.1);
    gain.gain.setValueAtTime(0.8, now); gain.gain.linearRampToValueAtTime(0, now + 1.5);
    osc.start(now); osc.stop(now + 1.5);
  }
}

function vibrate(pattern) {
  if (GAME.settings.haptic && navigator.vibrate) navigator.vibrate(pattern);
}

// ==========================================
// CORE LOOP
// ==========================================
function startGame() {
  initAudio();
  GAME.state = 'playing';
  GAME.time = 0;
  GAME.power = 100;
  GAME.doors = { left: false, right: false };
  GAME.lights = { left: false, right: false };
  GAME.camera.active = false;
  GAME.ducks.forEach(d => {
    d.location = d.path[0];
    d.difficulty = 2 + (GAME.night * 2); // Scaling difficulty
  });
  
  updateUI();
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('game-over-menu').classList.add('hidden');
  document.getElementById('win-menu').classList.add('hidden');
  document.getElementById('camera-feed').classList.remove('active');
  document.getElementById('cam-map').classList.remove('active');
  
  GAME.lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (GAME.state !== 'playing') return;
  const dt = (timestamp - GAME.lastTime) / 1000;
  GAME.lastTime = timestamp;
  
  // Time Progression (1 hour = 60 seconds real time for demo pacing)
  GAME.time += dt / 60;
  if (GAME.time >= 6) {
    GAME.state = 'win';
    playSound('blip');
    document.getElementById('win-menu').classList.remove('hidden');
    return;
  }
  
  // Power Drain
  let drain = 0.1; // Base drain
  if (GAME.doors.left) drain += 0.4;
  if (GAME.doors.right) drain += 0.4;
  if (GAME.lights.left) drain += 0.4;
  if (GAME.lights.right) drain += 0.4;
  if (GAME.camera.active) drain += 0.4;
  
  GAME.power -= drain * dt;
  if (GAME.power <= 0) {
    GAME.power = 0;
    powerOutage();
  }
  
  // AI Movement
  GAME.aiTimer += dt;
  if (GAME.aiTimer > 5) { // Check every 5 seconds
    GAME.aiTimer = 0;
    moveAI();
  }
  
  updateUI();
  checkJumpscare();
  requestAnimationFrame(gameLoop);
}

function moveAI() {
  GAME.ducks.forEach(duck => {
    if (Math.random() * 20 < duck.difficulty) {
      const currentIndex = duck.path.indexOf(duck.location);
      if (currentIndex < duck.path.length - 1) {
        // If at office door, check if door is closed
        const nextLoc = duck.path[currentIndex + 1];
        if (nextLoc === 'OFFICE_L' && GAME.doors.left) {
          playSound('error'); // Bump sound
          duck.location = duck.path[0]; // Reset to stage
        } else if (nextLoc === 'OFFICE_R' && GAME.doors.right) {
          playSound('error');
          duck.location = duck.path[0];
        } else {
          duck.location = nextLoc;
          if (duck.location !== 'OFFICE_L' && duck.location !== 'OFFICE_R') {
             // Only play step if not at door waiting
             // playSound('step'); 
          }
        }
      }
    }
  });
  updateCameraView();
}

function checkJumpscare() {
  GAME.ducks.forEach(duck => {
    if (duck.location === 'OFFICE_L' && !GAME.doors.left) triggerJumpscare();
    if (duck.location === 'OFFICE_R' && !GAME.doors.right) triggerJumpscare();
  });
}

function triggerJumpscare() {
  GAME.state = 'gameover';
  playSound('jumpscare');
  vibrate([500, 100, 500]);
  const js = document.getElementById('jumpscare');
  js.style.display = 'flex';
  setTimeout(() => {
    js.style.display = 'none';
    document.getElementById('game-over-menu').classList.remove('hidden');
  }, 2000);
}

function powerOutage() {
  GAME.doors.left = false; GAME.doors.right = false;
  GAME.lights.left = false; GAME.lights.right = false;
  GAME.camera.active = false;
  updateUI();
  // Freddy comes when power is out (simplified: instant game over after random time)
  setTimeout(() => {
    if (GAME.state === 'playing') triggerJumpscare();
  }, Math.random() * 10000 + 5000);
}

// ==========================================
// UI & INTERACTION
// ==========================================
function updateUI() {
  // Time
  const hour = Math.floor(GAME.time) === 0 ? 12 : Math.floor(GAME.time);
  document.getElementById('time-display').textContent = `${hour} AM`;
  
  // Power
  document.getElementById('power-display').textContent = `${Math.floor(GAME.power)}%`;
  
  // Usage Bars
  let usageLevel = 1;
  if (GAME.doors.left) usageLevel++;
  if (GAME.doors.right) usageLevel++;
  if (GAME.lights.left) usageLevel++;
  if (GAME.lights.right) usageLevel++;
  if (GAME.camera.active) usageLevel++;
  
  for (let i = 1; i <= 5; i++) {
    const bar = document.getElementById(`bar-${i}`);
    if (bar) bar.classList.toggle('active', i <= usageLevel);
  }
  
  // Doors & Lights Visuals
  document.getElementById('door-left').classList.toggle('closed', GAME.doors.left);
  document.getElementById('door-right').classList.toggle('closed', GAME.doors.right);
  
  document.getElementById('light-left-overlay').classList.toggle('light-active', GAME.lights.left);
  document.getElementById('light-right-overlay').classList.toggle('light-active', GAME.lights.right);
  
  // Show Ducks at Door if Light is On
  document.getElementById('duck-left').style.opacity = (GAME.lights.left && GAME.ducks.some(d => d.location === 'OFFICE_L')) ? 1 : 0;
  document.getElementById('duck-right').style.opacity = (GAME.lights.right && GAME.ducks.some(d => d.location === 'OFFICE_R')) ? 1 : 0;
  
  // Buttons
  document.getElementById('btn-door-left').classList.toggle('active', GAME.doors.left);
  document.getElementById('btn-door-right').classList.toggle('active', GAME.doors.right);
  document.getElementById('btn-light-left').classList.toggle('active', GAME.lights.left);
  document.getElementById('btn-light-right').classList.toggle('active', GAME.lights.right);
}

function toggleDoor(side) {
  if (GAME.power <= 0) return;
  GAME.doors[side] = !GAME.doors[side];
  playSound('blip');
  vibrate(20);
  updateUI();
}

function toggleLight(side) {
  if (GAME.power <= 0) return;
  GAME.lights[side] = !GAME.lights[side];
  // Turn off other light
  if (side === 'left') GAME.lights.right = false;
  else GAME.lights.left = false;
  playSound('blip');
  updateUI();
}

function toggleCamera() {
  if (GAME.power <= 0) return;
  GAME.camera.active = !GAME.camera.active;
  document.getElementById('camera-feed').classList.toggle('active', GAME.camera.active);
  document.getElementById('cam-map').classList.toggle('active', GAME.camera.active);
  playSound('blip');
  updateCameraView();
}

function updateCameraView() {
  const camContent = document.getElementById('cam-view-content');
  camContent.innerHTML = '';
  document.getElementById('cam-name').textContent = CAMERAS[GAME.camera.current] || 'Unknown';
  
  // Show duck if in this room
  const duckHere = GAME.ducks.find(d => d.location === GAME.camera.current);
  if (duckHere) {
    const duckDiv = document.createElement('div');
    duckDiv.className = 'duck-entity';
    duckDiv.style.opacity = 1;
    duckDiv.style.position = 'absolute';
    duckDiv.style.top = '50%'; duckDiv.style.left = '50%';
    duckDiv.style.transform = 'translate(-50%, -50%) scale(0.5)';
    duckDiv.innerHTML = `<div class="duck-body"><div class="duck-eye left"><div class="duck-pupil"></div></div><div class="duck-eye right"><div class="duck-pupil"></div></div><div class="duck-beak"></div></div>`;
    camContent.appendChild(duckDiv);
  }
}

// Event Listeners
document.getElementById('btn-door-left').addEventListener('click', () => toggleDoor('left'));
document.getElementById('btn-door-right').addEventListener('click', () => toggleDoor('right'));
document.getElementById('btn-light-left').addEventListener('click', () => toggleLight('left'));
document.getElementById('btn-light-right').addEventListener('click', () => toggleLight('right'));
document.getElementById('cam-toggle').addEventListener('click', toggleCamera);
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('menu-btn').addEventListener('click', () => {
  document.getElementById('game-over-menu').classList.add('hidden');
  document.getElementById('main-menu').classList.remove('hidden');
});
document.getElementById('next-night-btn').addEventListener('click', () => {
  GAME.night++;
  startGame();
});

document.querySelectorAll('.cam-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    GAME.camera.current = e.target.dataset.cam;
    playSound('blip');
    updateCameraView();
  });
});

// Keyboard Shortcuts
window.addEventListener('keydown', (e) => {
  if (GAME.state !== 'playing') return;
  if (e.key === 'q') toggleDoor('left');
  if (e.key === 'e') toggleDoor('right');
  if (e.key === 'a') toggleLight('left');
  if (e.key === 'd') toggleLight('right');
  if (e.key === ' ') toggleCamera();
});

// Android Back Button
history.pushState(null, null, location.href);
window.addEventListener('popstate', () => {
  if (GAME.state === 'playing') {
    toggleCamera(); // Use camera button as pause/close overlay
    history.pushState(null, null, location.href);
  }
});

</script>
